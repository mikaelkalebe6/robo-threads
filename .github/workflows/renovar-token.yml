name: Renovar token do Threads

on:
  schedule:
    - cron: "15 13 1,15 * *"   # dias 1 e 15 de cada mes
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Renovar
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
        run: python renovar_token.py
      - name: Gravar token novo no GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set THREADS_TOKEN --repo "${{ github.repository }}" < novo_token.txt
          rm -f novo_token.txt
          echo "Token atualizado."
