name: Artes IA

on:
  # roda sozinho quando o Claude coloca carrosseis novos na fila (lote de domingo) e pelo botao Run workflow
  push:
    branches: [main]
    paths: ["carrosseis/fila/**"]
  workflow_dispatch:
    inputs:
      teste:
        description: "Teste: descreva uma cena (deixe vazio para processar a fila)"
        required: false
        default: ""

concurrency:
  group: artes-ia
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # so para gravar o link das imagens no JSON da fila e o log
    timeout-minutes: 30  # trava: roda 1 vez por semana; o Stitch leva alguns minutos por imagem
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Gerar imagens no Stitch
        timeout-minutes: 26
        env:
          STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
          MIDIA_TOKEN: ${{ secrets.MIDIA_PAT }}
          STITCH_MAX_POR_RODADA: ${{ vars.STITCH_MAX_POR_RODADA }}
          TESTE: ${{ github.event.inputs.teste }}
        run: |
          if [ -n "$TESTE" ]; then python3 stitch.py --teste "$TESTE"; else python3 stitch.py; fi
      - name: Salvar
        if: always()
        env:
          STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carrosseis/fila carrosseis/stitch_log.json carrosseis/stitch_projeto.txt carrosseis/stitch_teste.jpg 2>/dev/null || true
          # trava: a chave nunca vai para o repositorio
          if [ -n "$STITCH_API_KEY" ] && git diff --cached | grep -qF "$STITCH_API_KEY"; then
            echo "::error::Chave do Stitch apareceu nos arquivos. Nada foi salvo."; git reset -q; exit 1
          fi
          git diff --cached --quiet || (git commit -m "artes ia" && (git push || (git pull --rebase && git push)))
