name: Robo Threads

on:
  schedule:
    # a cada 30 min, das 07h as 23h30 de Manaus (GitHub usa horario UTC). Reativado em 27/09/2026
    - cron: "7,37 11-23 * * *"
    - cron: "7,37 0-3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo-threads
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar robo
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLANILHA_URL: ${{ vars.PLANILHA_URL }}
          MODO_TESTE: ${{ vars.MODO_TESTE }}
          PAUSADO: ${{ vars.PAUSADO }}
          POSTS_MIN: ${{ vars.POSTS_MIN }}
          POSTS_MAX: ${{ vars.POSTS_MAX }}
          HORA_INICIO: ${{ vars.HORA_INICIO }}
          HORA_FIM: ${{ vars.HORA_FIM }}
          CHANCE_FOTO: ${{ vars.CHANCE_FOTO }}
          PERSONA: ${{ vars.PERSONA }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EXEMPLOS_RESPOSTAS: ${{ vars.EXEMPLOS_RESPOSTAS }}
          CHANCE_TENDENCIA: ${{ vars.CHANCE_TENDENCIA }}
          INTERVALO_MINIMO_MIN: ${{ vars.INTERVALO_MINIMO_MIN }}
          RESPOSTAS_POR_RODADA: ${{ vars.RESPOSTAS_POR_RODADA }}
          RESPOSTAS_POR_DIA: ${{ vars.RESPOSTAS_POR_DIA }}
          APPSHEET_APP: ${{ vars.APPSHEET_APP }}
        run: python bot.py
      - name: Ler inspiracoes (Gemini)
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          INSPIRACOES_URL: ${{ vars.INSPIRACOES_URL }}
          APPSHEET_APP: ${{ vars.APPSHEET_APP }}
        run: python inspiracoes.py
      - name: Salvar memoria do robo
        if: always()
        run: |
          git config user.name "robo-threads"
          git config user.email "robo@users.noreply.github.com"
          git add state.json
          for f in inspiracoes_lidas.md inspiracoes_estado.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "memoria do robo" && git push)
