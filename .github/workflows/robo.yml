name: Robo Threads

on:
  # Disparado so pelo despertador externo (cron-job.org), a cada 30 min, 7h as 23h37 de Manaus.
  # O schedule interno do GitHub foi removido em 27/09/2026 (quase nunca disparava e gerava rodada dupla).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo-threads
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # trava de seguranca: rodada normal leva 1 a 3 min
    steps:
      - uses: actions/checkout@v4
      # setup-python fica: o leitor de inspiracoes instala o yt-dlp com pip (o python do sistema bloqueia pip)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar robo
        timeout-minutes: 5
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          PLANILHA_URL: ${{ vars.PLANILHA_URL }}
          MODO_TESTE: ${{ vars.MODO_TESTE }}
          PAUSADO: ${{ vars.PAUSADO }}
          POSTS_MIN: ${{ vars.POSTS_MIN }}
          POSTS_MAX: ${{ vars.POSTS_MAX }}
          HORA_INICIO: ${{ vars.HORA_INICIO }}
          HORA_FIM: ${{ vars.HORA_FIM }}
          CHANCE_FOTO: ${{ vars.CHANCE_FOTO }}
          PERSONA: ${{ vars.PERSONA }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EXEMPLOS_RESPOSTAS: ${{ vars.EXEMPLOS_RESPOSTAS }}
          CHANCE_TENDENCIA: ${{ vars.CHANCE_TENDENCIA }}
          INTERVALO_MINIMO_MIN: ${{ vars.INTERVALO_MINIMO_MIN }}
          RESPOSTAS_POR_RODADA: ${{ vars.RESPOSTAS_POR_RODADA }}
          RESPOSTAS_POR_DIA: ${{ vars.RESPOSTAS_POR_DIA }}
          APPSHEET_APP: ${{ vars.APPSHEET_APP }}
          APPSHEET_TABELA: ${{ vars.APPSHEET_TABELA }}
          PERSONA_RESPOSTA: ${{ vars.PERSONA_RESPOSTA }}
          RESPOSTAS_POR_PESSOA: ${{ vars.RESPOSTAS_POR_PESSOA }}
          PAUSA_RESPOSTA_MIN: ${{ vars.PAUSA_RESPOSTA_MIN }}
          PAUSA_RESPOSTA_MAX: ${{ vars.PAUSA_RESPOSTA_MAX }}
          ATRASO_POST_MAX: ${{ vars.ATRASO_POST_MAX }}
          ATRASO_LINK_MIN: ${{ vars.ATRASO_LINK_MIN }}
          ATRASO_LINK_MAX: ${{ vars.ATRASO_LINK_MAX }}
          CHANCE_POST_RESERVA: ${{ vars.CHANCE_POST_RESERVA }}
          TESTE_RESERVA_ATE: ${{ vars.TESTE_RESERVA_ATE }}
          GEMINI_MODEL_RESPOSTA: ${{ vars.GEMINI_MODEL_RESPOSTA }}
        run: python bot.py
      - name: Renovar token do Threads (automatico)
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DIAS: ${{ vars.RENOVAR_TOKEN_DIAS || '10' }}
        run: |
          # renova o token de 60 dias do Threads sozinho, sem depender do agendamento interno do GitHub
          if [ -z "$GH_TOKEN" ]; then echo "Renovacao automatica desligada (falta o segredo GH_PAT)."; exit 0; fi
          ULT=$(cat token_renovado_em.txt 2>/dev/null || echo 0)
          AGORA=$(date +%s)
          if [ $((AGORA - ULT)) -lt $((DIAS * 86400)) ]; then echo "Token do Threads renovado ha menos de $DIAS dias."; exit 0; fi
          if python renovar_token.py && gh secret set THREADS_TOKEN --repo "${{ github.repository }}" < novo_token.txt; then
            echo "$AGORA" > token_renovado_em.txt
            echo "Token do Threads renovado e salvo no GitHub."
          else
            echo "::warning::Nao consegui renovar o token do Threads. Ver o log deste passo."
          fi
          rm -f novo_token.txt
      - name: Ler inspiracoes (Gemini)
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # modelo principal do Gemini fica so para os posts (cota gratis de 20/dia); leitor usa o lite
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL_INSPIRACOES || 'gemini-flash-lite-latest' }}
          INSPIRACOES_URL: ${{ vars.INSPIRACOES_URL }}
          APPSHEET_APP: ${{ vars.APPSHEET_APP }}
        run: python inspiracoes.py
      - name: Salvar memoria do robo
        if: always()
        run: |
          git config user.name "robo-threads"
          git config user.email "robo@users.noreply.github.com"
          git add state.json
          for f in inspiracoes_lidas.md inspiracoes_estado.json melhorias_lidas.md respostas_log.jsonl token_renovado_em.txt; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "memoria do robo" && (git push || (git pull --rebase && git push)))
